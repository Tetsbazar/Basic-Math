<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যোগ (Addition) - MCQ Quiz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
    
    <style>
        :root {
            --primary: #27ae60;
            --primary-dark: #1e8449;
            --primary-light: #d5f4e6;
            --bg-gradient: linear-gradient(135deg, #a8e6cf 0%, #27ae60 100%);
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            padding: 20px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 800px; width: 100%; }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }

        .nav-btn {
            background: var(--white);
            color: var(--primary-dark);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .nav-btn.secondary { background: rgba(255,255,255,0.2); color: white; backdrop-filter: blur(5px); }
        .nav-btn.secondary:hover { background: rgba(255,255,255,0.4); }

        /* VIEW 1: Topic Menu */
        #topic-menu { animation: fadeInUp 0.6s ease; }
        .menu-header { text-align: center; color: white; margin-bottom: 30px; }
        .menu-header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 8px rgba(0,0,0,0.2); }
        .menu-header p { font-size: 1.1rem; opacity: 0.95; }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .topic-card {
            background: var(--white);
            border-radius: 16px;
            padding: 25px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 5px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .topic-card:hover { transform: translateY(-8px) scale(1.02); }
        .topic-num { 
            background: var(--primary-light); color: var(--primary-dark); 
            width: 35px; height: 35px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 700; font-size: 0.9rem;
        }
        .topic-title { font-size: 1.2rem; font-weight: 700; color: var(--text-dark); }
        .topic-desc { font-size: 0.9rem; color: var(--text-light); }
        .topic-arrow { align-self: flex-end; color: var(--primary); font-size: 1.2rem; transition: 0.3s; }
        .topic-card:hover .topic-arrow { transform: translateX(5px); }

        /* VIEW 2: Quiz Interface */
        #quiz-container { display: none; animation: fadeInUp 0.5s ease; }

        .quiz-header {
            background: var(--white);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .quiz-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .quiz-title { font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); }
        .quiz-progress { font-size: 0.95rem; color: var(--text-light); font-weight: 600; }
        
        .progress-bar-bg { width: 100%; height: 8px; background: #ecf0f1; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; border-radius: 10px; }

        .quiz-card {
            background: var(--white);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: var(--shadow);
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .q-number { 
            background: var(--primary); color: white; padding: 5px 15px; 
            border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin: 0 auto 20px; width: fit-content;
        }

        .q-text { font-size: 1.6rem; color: var(--text-dark); margin-bottom: 30px; font-weight: 500; line-height: 1.4; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .option-btn.wrong {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        .option-btn:disabled { cursor: default; opacity: 0.9; }

        .quiz-actions {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: auto;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .btn-prev { background: #ecf0f1; color: var(--text-dark); }
        .btn-prev:hover:not(:disabled) { background: #bdc3c7; }
        .btn-prev:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-next { background: var(--primary); color: white; }
        .btn-next:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* VIEW 3: Result Screen */
        #result-container { display: none; text-align: center; animation: fadeInUp 0.5s ease; }
        .result-card {
            background: var(--white); border-radius: 20px; padding: 40px 30px; box-shadow: var(--shadow);
        }
        .result-emoji { font-size: 4rem; margin-bottom: 15px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .result-score { font-size: 2.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }
        .result-msg { font-size: 1.1rem; color: var(--text-light); margin-bottom: 30px; line-height: 1.5; }

        .result-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }

        /* Animations */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 600px) {
            .menu-header h1 { font-size: 1.8rem; }
            .q-text { font-size: 1.3rem; }
            .options-grid { grid-template-columns: 1fr; }
            .quiz-actions { flex-direction: column-reverse; }
            .action-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <button class="nav-btn" onclick="exitQuiz()">← মূল মেনু</button>
            <a href="index.html" class="nav-btn secondary">🏠 হোম</a>
        </div>

        <!-- VIEW 1: Topic Selection Menu -->
        <div id="topic-menu">
            <div class="menu-header">
                <h1>➕ যোগ (Addition)</h1>
                <p>অনুশীলনের জন্য নিচ থেকে যেকোনো একটি টপিক সিলেক্ট করুন</p>
            </div>
            <div class="topics-grid" id="topics-grid"></div>
        </div>

        <!-- VIEW 2: Quiz Interface -->
        <div id="quiz-container">
            <div class="quiz-header">
                <div class="quiz-header-top">
                    <div class="quiz-title" id="quiz-topic-title">টপিক নাম</div>
                    <div class="quiz-progress">প্রশ্ন <span id="current-q">1</span> / 5</div>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="quiz-progress-bar"></div>
                </div>
            </div>

            <div class="quiz-card">
                <div>
                    <div class="q-number" id="q-number-badge">প্রশ্ন ১</div>
                    <div class="q-text" id="q-text">Loading...</div>
                    <div class="options-grid" id="options-grid">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <div class="quiz-actions">
                    <button class="action-btn btn-prev" id="btn-prev" onclick="prevQuestion()">⬅️ পূর্ববর্তী</button>
                    <button class="action-btn btn-next" id="btn-next" onclick="nextQuestion()">পরবর্তী প্রশ্ন ➡️</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: Result Screen -->
        <div id="result-container">
            <div class="result-card">
                <div class="result-emoji" id="result-emoji">🎉</div>
                <div class="result-score" id="result-score">5 / 5</div>
                <div class="result-msg" id="result-msg">অসাধারণ! আপনি এই টপিকটি দারুণভাবে আয়ত্ত করেছেন।</div>
                <div class="result-actions">
                    <button class="action-btn btn-prev" onclick="restartQuiz()">🔄 আবার চেষ্টা করুন</button>
                    <button class="action-btn btn-next" onclick="exitQuiz()">📚 অন্য টপিক বাছাই করুন</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA: 10 Types, 5 Questions each (with 4 options and correct index) ---
        const quizData = [

            {
                id: 10, title: "মিশ্র যোগ", desc: "Mixed (Integer + Fraction + Decimal + Variable)",
                questions: [
                    { q: "$15 + \\frac{1}{2} + 3.5 = ?$", options: ["$19$", "$18.5$", "$19.5$", "$20$"], correct: 0 },
                    { q: "$(-20) + \\frac{3}{4} + 12.25 + 2x = ?$", options: ["$2x - 7$", "$2x + 7$", "$2x - 32$", "$2x + 32$"], correct: 0 },
                    { q: "$(3.5x + 10) + \\left(\\frac{x}{2} - 4\\right) + (-5) = ?$", options: ["$4x + 1$", "$4x - 1$", "$3x + 1$", "$4x + 19$"], correct: 0 },
                    { q: "$\\left(-\\frac{7}{2}\\right) + 1.5 + 5x + (-2x) = ?$", options: ["$3x - 2$", "$3x + 2$", "$-3x - 2$", "$3x - 5$"], correct: 0 },
                    { q: "$100 + (-25.5) + \\left(-\\frac{3}{4}\\right) + 4x + x^2 = ?$", options: ["$x^2 + 4x + 73.75$", "$x^2 + 4x + 74.25$", "$x^2 + 4x + 124.75$", "$x^2 + 4x - 73.75$"], correct: 0 }
                ]
            }
        ];

        // --- STATE VARIABLES ---
        let currentTopicIndex = 0;
        let currentQuestionIndex = 0;
        let userAnswers = []; // Stores user's selected option index for each question
        let shuffledQuestions = []; // Stores shuffled options for current topic

        // --- INITIALIZATION ---
        window.addEventListener('load', () => {
            renderMenu();
        });

        // --- RENDER MENU ---
        function renderMenu() {
            const grid = document.getElementById('topics-grid');
            grid.innerHTML = '';
            quizData.forEach((topic, index) => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.onclick = () => startQuiz(index);
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div class="topic-num">${topic.id}</div>
                        <div class="topic-arrow">➡️</div>
                    </div>
                    <div class="topic-title">${topic.title}</div>
                    <div class="topic-desc">${topic.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        // --- QUIZ LOGIC ---
        function shuffleOptions(question) {
            // Create array of objects with original index to track correct answer
            let opts = question.options.map((opt, i) => ({ 
                text: opt, 
                isCorrect: i === question.correct 
            }));
            // Fisher-Yates shuffle
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return opts;
        }

        function startQuiz(index) {
            currentTopicIndex = index;
            currentQuestionIndex = 0;
            userAnswers = new Array(5).fill(null);
            
            // Pre-shuffle all questions for this topic
            shuffledQuestions = quizData[index].questions.map(q => ({
                q: q.q,
                options: shuffleOptions(q)
            }));

            document.getElementById('topic-menu').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            
            document.getElementById('quiz-topic-title').innerText = quizData[index].title;
            loadQuestion();
        }

        function loadQuestion() {
            const q = shuffledQuestions[currentQuestionIndex];
            
            // Update UI Text
            document.getElementById('current-q').innerText = currentQuestionIndex + 1;
            document.getElementById('q-number-badge').innerText = `প্রশ্ন ${currentQuestionIndex + 1}`;
            document.getElementById('q-text').innerHTML = q.q;
            
            // Update Progress Bar
            const progress = ((currentQuestionIndex) / 5) * 100;
            document.getElementById('quiz-progress-bar').style.width = progress + '%';

            // Render Options
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            const labels = ['ক', 'খ', 'গ', 'ঘ'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span style="margin-right:8px; opacity:0.6;">${labels[idx]}.</span> ${opt.text}`;
                
                // If already answered, show state
                if (userAnswers[currentQuestionIndex] !== null) {
                    btn.disabled = true;
                    if (opt.isCorrect) {
                        btn.classList.add('correct');
                    } else if (idx === userAnswers[currentQuestionIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                
                optionsGrid.appendChild(btn);
            });

            // Update Navigation Buttons
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');
            
            prevBtn.style.display = currentQuestionIndex === 0 ? 'none' : 'flex';
            
            if (currentQuestionIndex === 4) {
                nextBtn.innerText = userAnswers[4] !== null ? '🏆 ফলাফল দেখুন' : 'উত্তর দিয়ে ফলাফল দেখুন';
                nextBtn.disabled = userAnswers[4] === null;
            } else {
                nextBtn.innerText = 'পরবর্তী প্রশ্ন ➡️';
                nextBtn.disabled = false;
            }

            // Re-render math
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('q-text'), {delimiters: [{left: '$', right: '$', display: false}]});
                renderMathInElement(optionsGrid, {delimiters: [{left: '$', right: '$', display: false}]});
            }
        }

        function selectOption(selectedIdx) {
            userAnswers[currentQuestionIndex] = selectedIdx;
            
            // Update UI immediately
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (shuffledQuestions[currentQuestionIndex].options[idx].isCorrect) {
                    btn.classList.add('correct');
                } else if (idx === selectedIdx) {
                    btn.classList.add('wrong');
                }
            });

            // Enable Next button
            const nextBtn = document.getElementById('btn-next');
            if (currentQuestionIndex === 4) {
                nextBtn.innerText = '🏆 ফলাফল দেখুন';
            }
            nextBtn.disabled = false;
        }

        function nextQuestion() {
            if (currentQuestionIndex < 4) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function showResult() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            
            // Calculate score
            let score = 0;
            userAnswers.forEach((ansIdx, qIdx) => {
                if (ansIdx !== null && shuffledQuestions[qIdx].options[ansIdx].isCorrect) {
                    score++;
                }
            });
            
            document.getElementById('result-score').innerText = `${score} / 5`;
            
            const emoji = document.getElementById('result-emoji');
            const msg = document.getElementById('result-msg');
            
            if (score === 5) {
                emoji.innerText = '🏆';
                msg.innerText = 'অসাধারণ! আপনি এই টপিকটি ১০০% নিখুঁতভাবে আয়ত্ত করেছেন।';
            } else if (score >= 3) {
                emoji.innerText = '👏';
                msg.innerText = 'ভালো হয়েছে! আরও একটু প্র্যাকটিস করলেই পারফেক্ট হয়ে যাবে।';
            } else {
                emoji.innerText = '💪';
                msg.innerText = 'চিন্তা নেই! আবার চেষ্টা করুন, প্র্যাকটিসেই মানুষ সিদ্ধহস্ত হয়।';
            }
        }

        function restartQuiz() {
            startQuiz(currentTopicIndex);
        }

        function exitQuiz() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('topic-menu').style.display = 'block';
        }
    </script>
</body>
</html>
