<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যোগ (Addition) - Interactive Quiz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
    
    <style>
        :root {
            --primary: #27ae60;
            --primary-dark: #1e8449;
            --primary-light: #d5f4e6;
            --bg-gradient: linear-gradient(135deg, #a8e6cf 0%, #27ae60 100%);
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            padding: 20px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 800px; width: 100%; }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }

        .back-btn {
            background: var(--white);
            color: var(--primary-dark);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover { transform: translateX(-5px); }

        .home-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .home-btn:hover { background: rgba(255,255,255,0.4); }

        /* VIEW 1: Topic Menu */
        #topic-menu { animation: fadeInUp 0.6s ease; }
        
        .menu-header { text-align: center; color: white; margin-bottom: 30px; }
        .menu-header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 8px rgba(0,0,0,0.2); }
        .menu-header p { font-size: 1.1rem; opacity: 0.95; }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .topic-card {
            background: var(--white);
            border-radius: 16px;
            padding: 25px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 5px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .topic-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        
        .topic-num { 
            background: var(--primary-light); color: var(--primary-dark); 
            width: 35px; height: 35px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 700; font-size: 0.9rem;
        }
        .topic-title { font-size: 1.2rem; font-weight: 700; color: var(--text-dark); }
        .topic-desc { font-size: 0.9rem; color: var(--text-light); }
        .topic-arrow { align-self: flex-end; color: var(--primary); font-size: 1.2rem; transition: 0.3s; }
        .topic-card:hover .topic-arrow { transform: translateX(5px); }

        /* VIEW 2: Quiz Interface */
        #quiz-container { display: none; animation: fadeInUp 0.5s ease; }

        .quiz-header {
            background: var(--white);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .quiz-title { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); }
        .quiz-progress { font-size: 0.95rem; color: var(--text-light); font-weight: 600; }
        
        .progress-bar-bg {
            width: 100%; height: 8px; background: #ecf0f1; border-radius: 10px; margin-top: 10px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; border-radius: 10px;
        }

        .quiz-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            text-align: center;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .q-number { 
            background: var(--primary); color: white; padding: 5px 15px; 
            border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px;
        }

        .q-text { font-size: 1.8rem; color: var(--text-dark); margin-bottom: 30px; font-weight: 500; }

        .answer-reveal {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: none;
            animation: popIn 0.3s ease;
            border: 2px dashed var(--primary);
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .quiz-actions { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }

        .btn {
            padding: 12px 25px; border-radius: 50px; border: none; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-show { background: var(--text-dark); color: white; }
        .btn-show:hover { background: #1a252f; }
        
        .btn-correct { background: var(--success); color: white; display: none; }
        .btn-correct:hover { background: #27ae60; transform: scale(1.05); }
        
        .btn-wrong { background: var(--danger); color: white; display: none; }
        .btn-wrong:hover { background: #c0392b; transform: scale(1.05); }

        .btn-next { background: var(--primary); color: white; display: none; }
        .btn-next:hover { background: var(--primary-dark); transform: scale(1.05); }

        /* VIEW 3: Result Screen */
        #result-container { display: none; text-align: center; animation: fadeInUp 0.5s ease; }
        .result-card {
            background: var(--white); border-radius: 20px; padding: 40px; box-shadow: var(--shadow);
        }
        .result-emoji { font-size: 4rem; margin-bottom: 15px; }
        .result-score { font-size: 2.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }
        .result-msg { font-size: 1.2rem; color: var(--text-light); margin-bottom: 30px; }

        /* Animations */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 600px) {
            .menu-header h1 { font-size: 1.8rem; }
            .q-text { font-size: 1.3rem; }
            .quiz-actions { flex-direction: column; width: 100%; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">← মূল মেনু</a>
            <a href="index.html" class="home-btn">🏠 হোম</a>
        </div>

        <!-- VIEW 1: Topic Selection Menu -->
        <div id="topic-menu">
            <div class="menu-header">
                <h1>➕ যোগ (Addition)</h1>
                <p>অনুশীলনের জন্য নিচ থেকে যেকোনো একটি টপিক সিলেক্ট করুন</p>
            </div>
            <div class="topics-grid" id="topics-grid">
                <!-- Topics will be injected here by JS -->
            </div>
        </div>

        <!-- VIEW 2: Quiz Interface -->
        <div id="quiz-container">
            <div class="quiz-header">
                <div>
                    <div class="quiz-title" id="quiz-topic-title">টপিক নাম</div>
                    <div class="quiz-progress">প্রশ্ন <span id="current-q">1</span> / 5</div>
                </div>
                <button class="btn" style="background: #ecf0f1; color: var(--text-dark);" onclick="exitQuiz()">✕ বন্ধ করুন</button>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="quiz-progress-bar"></div>
                </div>
            </div>

            <div class="quiz-card">
                <div class="q-number" id="q-number-badge">প্রশ্ন ১</div>
                <div class="q-text" id="q-text">Loading...</div>
                
                <div class="answer-reveal" id="answer-reveal"></div>

                <div class="quiz-actions">
                    <button class="btn btn-show" id="btn-show" onclick="showAnswer()">👁 উত্তর দেখুন</button>
                    <button class="btn btn-correct" id="btn-correct" onclick="markResult(true)">✅ আমি ঠিক করেছি</button>
                    <button class="btn btn-wrong" id="btn-wrong" onclick="markResult(false)">❌ ভুল হয়েছে</button>
                    <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">পরবর্তী প্রশ্ন ➡️</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: Result Screen -->
        <div id="result-container">
            <div class="result-card">
                <div class="result-emoji" id="result-emoji">🎉</div>
                <div class="result-score" id="result-score">5 / 5</div>
                <div class="result-msg" id="result-msg">অসাধারণ! আপনি এই টপিকটি দারুণভাবে আয়ত্ত করেছেন।</div>
                <div class="quiz-actions">
                    <button class="btn btn-show" onclick="restartQuiz()">🔄 আবার চেষ্টা করুন</button>
                    <button class="btn btn-next" style="display:flex;" onclick="exitQuiz()">📚 অন্য টপিক বাছাই করুন</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- DATA: 10 Types, 5 Questions each ---
        const quizData = [
            {
                id: 1, title: "পূর্ণসংখ্যার যোগ", desc: "ধনাত্মক ও ঋণাত্মক সংখ্যা",
                questions: [
                    { q: "$(+35) + (-12) = ?$", a: "$23$" },
                    { q: "$(-84) + (-26) = ?$", a: "$-110$" },
                    { q: "$(+105) + (+49) = ?$", a: "$154$" },
                    { q: "$(-63) + (+91) = ?$", a: "$28$" },
                    { q: "$(-210) + (+150) + (-40) = ?$", a: "$-100$" }
                ]
            },
            {
                id: 2, title: "সাধারণ ভগ্নাংশের যোগ", desc: "ভিন্ন হর (Different Denominators)",
                questions: [
                    { q: "$\\frac{1}{2} + \\frac{1}{3} = ?$", a: "$\\frac{5}{6}$" },
                    { q: "$\\frac{3}{5} + \\frac{7}{10} = ?$", a: "$\\frac{13}{10}$" },
                    { q: "$\\frac{5}{6} + \\frac{3}{8} = ?$", a: "$\\frac{29}{24}$" },
                    { q: "$\\frac{4}{9} + \\frac{5}{12} = ?$", a: "$\\frac{31}{36}$" },
                    { q: "$\\frac{7}{15} + \\frac{11}{20} = ?$", a: "$\\frac{61}{60}$" }
                ]
            },
            {
                id: 3, title: "ঋণাত্মক ও ধনাত্মক ভগ্নাংশ", desc: "চিহ্নসহ ভগ্নাংশের যোগ",
                questions: [
                    { q: "$\\left(-\\frac{3}{4}\\right) + \\frac{1}{2} = ?$", a: "$-\\frac{1}{4}$" },
                    { q: "$\\frac{5}{7} + \\left(-\\frac{2}{3}\\right) = ?$", a: "$\\frac{1}{21}$" },
                    { q: "$\\left(-\\frac{7}{8}\\right) + \\left(-\\frac{1}{4}\\right) = ?$", a: "$-\\frac{9}{8}$" },
                    { q: "$\\frac{9}{10} + \\left(-\\frac{3}{5}\\right) + \\frac{1}{2} = ?$", a: "$\\frac{4}{5}$" },
                    { q: "$\\left(-\\frac{11}{12}\\right) + \\frac{5}{6} + \\left(-\\frac{1}{3}\\right) = ?$", a: "$-\\frac{5}{12}$" }
                ]
            },
            {
                id: 4, title: "সাধারণ দশমিক সংখ্যার যোগ", desc: "Decimal Addition",
                questions: [
                    { q: "$18.4 + 6.25 = ?$", a: "$24.65$" },
                    { q: "$35.02 + 4.8 + 12.356 = ?$", a: "$52.176$" },
                    { q: "$105.5 + 0.075 + 14.2 = ?$", a: "$119.775$" },
                    { q: "$0.333 + 0.667 + 5.1 = ?$", a: "$6.1$" },
                    { q: "$78.9 + 21.05 + 3.002 + 0.4 = ?$", a: "$103.352$" }
                ]
            },
            {
                id: 5, title: "ঋণাত্মক ও ধনাত্মক দশমিক", desc: "Signed Decimal Addition",
                questions: [
                    { q: "$(-14.5) + (+8.2) = ?$", a: "$-6.3$" },
                    { q: "$(-25.75) + (-12.25) = ?$", a: "$-38$" },
                    { q: "$(+64.3) + (-31.85) = ?$", a: "$32.45$" },
                    { q: "$(-5.05) + (+12.4) + (-3.15) = ?$", a: "$4.2$" },
                    { q: "$(+100.25) + (-45.5) + (-20.75) = ?$", a: "$34$" }
                ]
            },
            {
                id: 6, title: "একচল বিশিষ্ট বীজগণিত", desc: "Single Variable (x) Expressions",
                questions: [
                    { q: "$(3x + 5) + (4x + 9) = ?$", a: "$7x + 14$" },
                    { q: "$(-7x + 2) + (11x - 8) = ?$", a: "$4x - 6$" },
                    { q: "$(15x - 12) + (-6x - 4) = ?$", a: "$9x - 16$" },
                    { q: "$(8x + 3) + (-8x + 15) = ?$", a: "$18$" },
                    { q: "$(2.5x + 4) + (1.5x - 7) = ?$", a: "$4x - 3$" }
                ]
            },
            {
                id: 7, title: "ঘাতযুক্ত বীজগণিতীয় যোগ", desc: "Polynomials (x², x, constants)",
                questions: [
                    { q: "$(2x^2 + 3x + 1) + (x^2 + 5x + 4) = ?$", a: "$3x^2 + 8x + 5$" },
                    { q: "$(5x^2 - 4x + 7) + (-2x^2 + x - 9) = ?$", a: "$3x^2 - 3x - 2$" },
                    { q: "$(-3x^2 + 8x - 5) + (-x^2 - 3x + 12) = ?$", a: "$-4x^2 + 5x + 7$" },
                    { q: "$(4x^2 - 10) + (3x^2 + 5x - 2) = ?$", a: "$7x^2 + 5x - 12$" },
                    { q: "$(x^2 + x + 1) + (2x^2 - 2x - 2) + (-3x^2 + x + 1) = ?$", a: "$0$" }
                ]
            },
            {
                id: 8, title: "একাধিক চলবিশিষ্ট বীজগণিত", desc: "Multiple Variables (x, y)",
                questions: [
                    { q: "$(3x + 2y) + (5x + 4y) = ?$", a: "$8x + 6y$" },
                    { q: "$(7x - 3y + 4) + (-2x + 5y - 9) = ?$", a: "$5x + 2y - 5$" },
                    { q: "$(10x + 8y - 6) + (-10x - 8y + 6) = ?$", a: "$0$" },
                    { q: "$(4x^2 + 2xy + y^2) + (x^2 - 3xy + 2y^2) = ?$", a: "$5x^2 - xy + 3y^2$" },
                    { q: "$(-5x + 12y - 3) + (8x - 4y + 7) + (-2x - y) = ?$", a: "$x + 7y + 4$" }
                ]
            },
            {
                id: 9, title: "ভগ্নাংশযুক্ত বীজগণিত", desc: "Fractional Algebraic Expressions",
                questions: [
                    { q: "$\\frac{x}{2} + \\frac{x}{3} = ?$", a: "$\\frac{5x}{6}$" },
                    { q: "$\\left(\\frac{2x}{3} + 1\\right) + \\left(\\frac{x}{4} - 3\\right) = ?$", a: "$\\frac{11x}{12} - 2$" },
                    { q: "$\\left(\\frac{3x}{5} - \\frac{y}{2}\\right) + \\left(\\frac{x}{10} + \\frac{3y}{4}\\right) = ?$", a: "$\\frac{7x}{10} + \\frac{y}{4}$" },
                    { q: "$\\left(\\frac{x^2}{2} + x\\right) + \\left(\\frac{x^2}{4} - \\frac{x}{3}\\right) = ?$", a: "$\\frac{3x^2}{4} + \\frac{2x}{3}$" },
                    { q: "$\\left(-\\frac{5x}{6} + 2\\right) + \\left(\\frac{3x}{4} - \\frac{1}{2}\\right) = ?$", a: "$-\\frac{x}{12} + \\frac{3}{2}$" }
                ]
            },
            {
                id: 10, title: "মিশ্র যোগ", desc: "Mixed (Integer + Fraction + Decimal + Variable)",
                questions: [
                    { q: "$15 + \\frac{1}{2} + 3.5 = ?$", a: "$19$" },
                    { q: "$(-20) + \\frac{3}{4} + 12.25 + 2x = ?$", a: "$2x - 7$" },
                    { q: "$(3.5x + 10) + \\left(\\frac{x}{2} - 4\\right) + (-5) = ?$", a: "$4x + 1$" },
                    { q: "$\\left(-\\frac{7}{2}\\right) + 1.5 + 5x + (-2x) = ?$", a: "$3x - 2$" },
                    { q: "$100 + (-25.5) + \\left(-\\frac{3}{4}\\right) + 4x + x^2 = ?$", a: "$x^2 + 4x + 73.75$" }
                ]
            }
        ];

        // --- STATE VARIABLES ---
        let currentTopicIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;

        // --- INITIALIZATION ---
        window.addEventListener('load', () => {
            renderMenu();
        });

        // --- RENDER MENU ---
        function renderMenu() {
            const grid = document.getElementById('topics-grid');
            grid.innerHTML = '';
            quizData.forEach((topic, index) => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.onclick = () => startQuiz(index);
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div class="topic-num">${topic.id}</div>
                        <div class="topic-arrow">➡️</div>
                    </div>
                    <div class="topic-title">${topic.title}</div>
                    <div class="topic-desc">${topic.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        // --- QUIZ LOGIC ---
        function startQuiz(index) {
            currentTopicIndex = index;
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById('topic-menu').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            
            document.getElementById('quiz-topic-title').innerText = quizData[index].title;
            loadQuestion();
        }

        function loadQuestion() {
            const topic = quizData[currentTopicIndex];
            const q = topic.questions[currentQuestionIndex];
            
            // Update UI
            document.getElementById('current-q').innerText = currentQuestionIndex + 1;
            document.getElementById('q-number-badge').innerText = `প্রশ্ন ${currentQuestionIndex + 1}`;
            document.getElementById('q-text').innerHTML = q.q;
            
            // Reset buttons and answer
            document.getElementById('answer-reveal').style.display = 'none';
            document.getElementById('answer-reveal').innerHTML = q.a;
            
            document.getElementById('btn-show').style.display = 'flex';
            document.getElementById('btn-correct').style.display = 'none';
            document.getElementById('btn-wrong').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';

            // Update progress bar
            const progress = ((currentQuestionIndex) / 5) * 100;
            document.getElementById('quiz-progress-bar').style.width = progress + '%';

            // Re-render math
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('q-text'), {delimiters: [{left: '$', right: '$', display: false}]});
                renderMathInElement(document.getElementById('answer-reveal'), {delimiters: [{left: '$', right: '$', display: false}]});
            }
        }

        function showAnswer() {
            document.getElementById('answer-reveal').style.display = 'block';
            document.getElementById('btn-show').style.display = 'none';
            document.getElementById('btn-correct').style.display = 'flex';
            document.getElementById('btn-wrong').style.display = 'flex';
        }

        function markResult(isCorrect) {
            if (isCorrect) score++;
            
            document.getElementById('btn-correct').style.display = 'none';
            document.getElementById('btn-wrong').style.display = 'none';
            
            if (currentQuestionIndex < 4) {
                document.getElementById('btn-next').style.display = 'flex';
            } else {
                // Last question, show finish button
                const nextBtn = document.getElementById('btn-next');
                nextBtn.innerText = '🏆 ফলাফল দেখুন';
                nextBtn.style.display = 'flex';
                nextBtn.onclick = showResult;
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function showResult() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            
            document.getElementById('result-score').innerText = `${score} / 5`;
            
            const emoji = document.getElementById('result-emoji');
            const msg = document.getElementById('result-msg');
            
            if (score === 5) {
                emoji.innerText = '🏆';
                msg.innerText = 'অসাধারণ! আপনি এই টপিকটি ১০০% আয়ত্ত করেছেন।';
            } else if (score >= 3) {
                emoji.innerText = '👏';
                msg.innerText = 'ভালো হয়েছে! আরও একটু প্র্যাকটিস করলেই পারফেক্ট হয়ে যাবে।';
            } else {
                emoji.innerText = '💪';
                msg.innerText = 'চিন্তা নেই! আবার চেষ্টা করুন, প্র্যাকটিসেই মানুষ সিদ্ধহস্ত হয়।';
            }
        }

        function restartQuiz() {
            startQuiz(currentTopicIndex);
        }

        function exitQuiz() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('topic-menu').style.display = 'block';
            
            // Reset next button text for next time
            const nextBtn = document.getElementById('btn-next');
            nextBtn.innerText = 'পরবর্তী প্রশ্ন ➡️';
            nextBtn.onclick = nextQuestion;
        }
    </script>
</body>
</html>
